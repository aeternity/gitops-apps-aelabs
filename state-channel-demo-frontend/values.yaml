app:
  image:
    repository: "aeternitybot/state-channel-demo-frontend"
    pullPolicy: "Always"
    tag: "latest"
  ingress:
    enabled: true
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      cert-manager.io/cluster-issuer: letsencrypt
  probes:
    liveness:
      enabled: false
    readiness:
      enabled: false
  serviceMonitor:
    enabled: false
