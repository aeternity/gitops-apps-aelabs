app:
  image:
    tag: "latest"
    repository: "aeternity/aescan"
    pullPolicy: "Always"
  resources:
    limits:
      memory: 1500Mi
      cpu: 1000m
    requests:
      memory: 1000Mi
      cpu: 750m
  ingress:
    enabled: true
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      cert-manager.io/cluster-issuer: letsencrypt
