app:
  image:
    repository: "aeternity/aescan"
    pullPolicy: "Always"
  resources:
    limits:
      memory: 700Mi
      cpu: 1500m
    requests:
      memory: 450Mi
      cpu: 1000m
  ingress:
    enabled: true
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      cert-manager.io/cluster-issuer: letsencrypt
  serviceMonitor:
    enabled: false
