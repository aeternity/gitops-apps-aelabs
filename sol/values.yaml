app:
  service:
    port: "80"
  image:
    tag: "develop"
    repository: "aeternity/sol"
    pullPolicy: "Always"
  resources:
    limits:
      memory: 50Mi
      cpu: 250m
    requests:
      memory: 50Mi
      cpu: 100m
  probes:
    liveness:
      enabled: false
    readiness:
      enabled: false
  ingress:
    enabled: true
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      cert-manager.io/cluster-issuer: letsencrypt
  serviceMonitor:
    enabled: false
