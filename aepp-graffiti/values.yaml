app:
  image:
    repository: aeternity/aepp-grafitti
    tag: "dev"
    pullPolicy: "Always"
  resources:
    limits:
      memory: 750Mi
      cpu: 150m
    requests:
      memory: 500Mi
      cpu: 100m
  service:
    port: 80
  ingress:
    enabled: true
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      cert-manager.io/cluster-issuer: letsencrypt
  serviceMonitor:
    enabled: false
