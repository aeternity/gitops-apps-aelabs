  image:
    repository: aeternity/superhero-backend
    tag: "v3.1.13"
    pullPolicy: "Always"
  probes:
    liveness:
      enabled: false
    readiness:
      enabled: false
  service:
    port: 3000
  resources:
    limits:
      memory: 3500Mi
      cpu: 3
    requests:
      memory: 3500Mi
      cpu: 2
  ingress:
    enabled: true
    annotations:
      traefik.ingress.kubernetes.io/router.middlewares: apps-superhero-backend-app-text-compression@kubernetescrd
    TextCompression: true
    hosts:
      - host: "superhero-backend-mainnet.prd.service.aepps.com"
        paths:
          - path: "/"
  persistence:
    enabled: true
    disks:
      - name: disk1
        storageClass: "hcloud-volumes"
        accessMode: "ReadWriteOnce"
        size: "50Gi"
        mountPath: "/app/traces"
      - name: disk2
        storageClass: "hcloud-volumes"
        accessMode: "ReadWriteOnce"
        size: "50Gi"
        mountPath: "/app/images"
  podSecurityContext:
    fsGroup: 65533
    runAsUser: 1001
    runAsGroup: 65533
