app:
  image:
    repository: aeternity/aepp-grafitti
    tag: latest
    pullPolicy: "Always"
  resources:
    limits:
      memory: 450Mi
    requests:
      memory: 300Mi
  service:
    port: 80
  ingress:
    enabled: true
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      cert-manager.io/cluster-issuer: letsencrypt
    hosts:
      - host: "graffiti.dev.service.aepps.com"
        paths:
          - path: "/"
  serviceMonitor:
    enabled: false
