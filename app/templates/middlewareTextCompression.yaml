{{- if and .Values.ingress.enabled .Values.ingress.TextCompression -}}
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: {{ include "app.fullname" . }}
spec:
  compress:
    enabled: true
    # You can customize the compression settings as per your requirements
    # For example, setting minResponseSize and mimeTypes
    minResponseSize: 1
    mimeTypes:
      - text/html
      - text/css
      - application/javascript
      - application/json
      - application/xml
      - application/rss+xml
{{- end }}
