app:
  image:
    repository: aeternitybot/test-repo
    pullPolicy: "Always"
    tag: "latest"

  resources:
    limits:
      memory: 72Mi
    requests:
      memory: 72M
  service:
    port: 5000

  ingress:
    enabled: true
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      cert-manager.io/cluster-issuer: letsencrypt

  env:
    "EPOCH_URL_DEBUG": "https://testnet.aeternity.io"
    "EXPLORER_URL": "https://explorer.testnet.aeternity.io"
    "NODE_URL": "https://testnet.aeternity.io"
  probes:
    liveness:
      enabled: false
    readiness:
      enabled: false
