app:
  image:
    repository: aeternitybot/test-repo
    pullPolicy: "Always"
    tag: "latest"

  resources:
    limits:
      memory: 72Mi
    requests:
      memory: 72M
  service:
    port: 5000

  ingress:
    enabled: true
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      cert-manager.io/cluster-issuer: letsencrypt

  serviceMonitor:
    enabled: false
  env:
    "EPOCH_URL_DEBUG": "https://testnet.aeternity.io"
    "EXPLORER_URL": "https://explorer.testnet.aeternity.io"
    "NODE_URL": "https://testnet.aeternity.io"
  secrets:
    external:
      values:
        FAUCET_ACCOUNT_PRIV_KEY: /apps/FAUCET_ACCOUNT_PRIV_KEY
  
  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""